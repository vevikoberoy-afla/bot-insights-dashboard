<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Website Iframe Embed Test</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      max-width: 600px;
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }
    .iframe-wrapper {
      width: 432px;
      height: 720px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Client Website Iframe Embed Test</h1>
    <p>Below is how the widget embeds inside a client's website using an &lt;iframe&gt;.</p>
  </div>

  <div class="iframe-wrapper">
    <iframe src="/widget?iframe=true" title="Chat Widget" allow="camera;microphone"></iframe>
  </div>
</body>
</html>
